# nginx do container moneyflow-web: faz em produção o que o proxy do Vite faz em desenvolvimento.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: repassada ao container "api" pela rede interna do Docker
  location /api/ {
    proxy_pass http://api:3334;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por muito tempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: rotas do React Router (/movimentos, /contas...) caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
